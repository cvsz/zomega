- name: Deploy zomega production host
  hosts: zomega
  become: true
  vars:
    zomega_dir: /opt/zomega
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, postgresql-client]
        state: present
        update_cache: true
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ zomega_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
    - name: Copy release
      ansible.builtin.copy:
        src: ../../
        dest: "{{ zomega_dir }}/"
        owner: root
        group: root
        mode: preserve
    - name: Start services
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: "{{ zomega_dir }}"
      changed_when: true
