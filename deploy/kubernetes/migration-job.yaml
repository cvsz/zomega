apiVersion: batch/v1
kind: Job
metadata:
  name: omega-migrate
  namespace: omega
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {app: omega-migrate}
    spec:
      restartPolicy: Never
      serviceAccountName: omega
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/cvsz/zomega:3.0.0
          command: ["alembic","upgrade","head"]
          envFrom: [{secretRef: {name: omega-runtime}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: tmp
          emptyDir: {}
