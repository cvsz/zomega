apiVersion: v1
kind: ServiceAccount
metadata: {name: zomega, namespace: zomega}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: zomega-read, namespace: zomega}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: zomega-read, namespace: zomega}
subjects: [{kind: ServiceAccount, name: zomega, namespace: zomega}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zomega-read}
