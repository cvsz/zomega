apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omega-default-deny
  namespace: omega
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omega-api-ingress
  namespace: omega
spec:
  podSelector:
    matchLabels: {app: omega-api}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omega-runtime-egress
  namespace: omega
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [omega-api, omega-worker, omega-migrate]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
