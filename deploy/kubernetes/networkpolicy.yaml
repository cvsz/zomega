apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zomega-default-deny
  namespace: zomega
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zomega-api-ingress
  namespace: zomega
spec:
  podSelector:
    matchLabels: {app: zomega-api}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zomega-runtime-egress
  namespace: zomega
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [zomega-api, zomega-worker, zomega-migrate]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
