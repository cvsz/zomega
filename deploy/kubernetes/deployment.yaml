apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomega-api
  namespace: zomega
spec:
  replicas: 2
  selector: {matchLabels: {app: zomega-api}}
  template:
    metadata: {labels: {app: zomega-api}}
    spec:
      serviceAccountName: zomega
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: zomega-api}
      containers:
        - name: api
          image: ghcr.io/cvsz/zomega:3.0.0
          imagePullPolicy: IfNotPresent
          command: ["python","-m","zomega","serve"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{secretRef: {name: zomega-runtime}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
            limits: {cpu: "2", memory: "2Gi"}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomega-worker
  namespace: zomega
spec:
  replicas: 2
  selector: {matchLabels: {app: zomega-worker}}
  template:
    metadata: {labels: {app: zomega-worker}}
    spec:
      serviceAccountName: zomega
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: zomega-worker}
      containers:
        - name: worker
          image: ghcr.io/cvsz/zomega:3.0.0
          imagePullPolicy: IfNotPresent
          command: ["arq","zomega.jobs.WorkerSettings"]
          envFrom: [{secretRef: {name: zomega-runtime}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
            limits: {cpu: "2", memory: "2Gi"}
      volumes:
        - name: tmp
          emptyDir: {}
