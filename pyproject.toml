[project]
name = "omega-production"
version = "2.2.0"
description = "Production paid-before-use multi-agent skills platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "prometheus-client==0.22.1",
  "SQLAlchemy==2.0.43",
  "psycopg[binary,pool]==3.2.9",
  "alembic==1.16.5",
  "redis==5.3.1",
  "arq==0.26.3",
  "stripe==12.5.0",
  "openai==1.107.0",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "python-json-logger==3.3.0"
]

[project.scripts]
omega = "omega.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
