id: zomega-full
stages:
  - id: discover
    agent: zomega-architect
    skills: [mission-interpreter, repository-intelligence, gap-analysis]
  - id: plan
    agent: zomega-architect
    skills: [architecture-generator, implementation-roadmap]
  - id: secure
    agent: zomega-security
    skills: [secret-inventory, secret-leak-auditor, threat-model, security-baseline]
  - id: build
    parallel:
      - agent: zomega-backend
      - agent: zomega-frontend
      - agent: zomega-devops
  - id: verify
    agent: zomega-qa
    skills: [test-strategy, security-tests, production-readiness-checker, evidence-generator]
  - id: release
    agent: zomega-release
    skills: [final-release-gate]
