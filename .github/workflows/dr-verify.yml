name: Disaster Recovery Drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "DR verification is disabled until target identity and Environment protection are verified"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zomega-disaster-recovery
  cancel-in-progress: false

jobs:
  restore-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Block unverified restore verification
        shell: bash
        run: |
          set -euo pipefail
          echo "Disaster recovery restore verification is disabled pending independent target-cluster identity and production Environment protection evidence." >&2
          exit 64
