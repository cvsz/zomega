name: Disaster Recovery Drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DRILL to confirm use of the dedicated restore database"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zomega-disaster-recovery
  cancel-in-progress: false

jobs:
  restore-verification:
    environment: production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DR_SOURCE_DATABASE_URL }}
      ZOMEGA_SOURCE_DATABASE_URL: ${{ secrets.DR_SOURCE_DATABASE_URL }}
      ZOMEGA_RESTORE_VERIFY_DATABASE_URL: ${{ secrets.DR_RESTORE_DATABASE_URL }}
      ZOMEGA_RESTORE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
      - name: Require explicit drill confirmation
        env:
          DR_CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$DR_CONFIRMATION" = "DRILL"
      - name: Validate dedicated database configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$ZOMEGA_SOURCE_DATABASE_URL"
          test -n "$ZOMEGA_RESTORE_VERIFY_DATABASE_URL"
          test "$ZOMEGA_RESTORE_CONFIRMATION" = "DRILL"
      - name: Test restore safety guards without database access
        run: python3 -m unittest discover -s tests -p 'test_restore_verify_safety.py' -v
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create ephemeral backup evidence
        run: ./backup.sh
      - name: Restore and verify
        shell: bash
        run: |
          set -euo pipefail
          export ZOMEGA_BACKUP_FILE="$(ls -1t backups/zomega-*.dump | head -n1)"
          ./restore-verify.sh
      - name: Remove ephemeral backup
        if: always()
        run: rm -rf backups
