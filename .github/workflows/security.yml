name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  application-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Reject tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env$|id_rsa$|id_ed25519$|.*\.pem$|.*\.key$|credentials\.json$|service-account\.json$)'
      - name: Install audit tools
        run: python -m pip install pip-audit bandit
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Python SAST
        run: bandit -q -r zomega -x tests
      - name: Build production image
        run: docker build --pull -t zomega-security-scan:${{ github.sha }} .
      - name: Capture image identity and resolved OS package manifest
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="zomega-security-scan:${GITHUB_SHA}"
          docker image inspect "$image" --format 'image_config_digest={{.Id}}' > zomega-image-evidence.txt
          printf 'tested_ref_commit=%s\npr_head_commit=%s\nbase_image=python:3.12.15-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704\n' "$GITHUB_SHA" "$PR_HEAD_SHA" >> zomega-image-evidence.txt
          docker run --rm --entrypoint cat "$image" /usr/share/zomega/os-packages.tsv > zomega-os-packages.tsv
          test -s zomega-os-packages.tsv
          sha256sum zomega-os-packages.tsv >> zomega-image-evidence.txt
      - name: Filesystem, secret, dependency and IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zomega-security-scan:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate SBOM for the exact scanned image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: zomega-security-scan:${{ github.sha }}
          format: spdx-json
          output-file: zomega-image-sbom.spdx.json
          artifact-name: zomega-image-sbom-${{ github.sha }}.spdx.json
          upload-release-assets: false
      - name: Upload image identity and OS package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zomega-image-build-evidence-${{ github.sha }}
          path: |
            zomega-image-evidence.txt
            zomega-os-packages.tsv
          if-no-files-found: error
          retention-days: 30
