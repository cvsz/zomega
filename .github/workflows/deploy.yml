name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character commit SHA used as the immutable image tag"
        required: true
        type: string
      kubectl_version:
        description: "Pinned kubectl vX.Y.Z compatible with the production API server (within one minor version)"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: zomega-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      KUBECTL_VERSION: ${{ inputs.kubectl_version }}
    steps:
      - name: Validate deployment inputs before installing tools or loading credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
            echo "image_tag must be a full lowercase 40-character commit SHA" >&2
            exit 1
          }
          [[ "$KUBECTL_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "kubectl_version must use the exact vX.Y.Z format" >&2
            exit 1
          }

      - name: Checkout protected main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release source commit to be reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${IMAGE_TAG}^{commit}"
          git merge-base --is-ancestor "$IMAGE_TAG" FETCH_HEAD || {
            echo "Release source commit is not reachable from current main" >&2
            exit 1
          }
          echo "release_source_commit=verified"

      - name: Set up pinned kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ inputs.kubectl_version }}

      - name: Set up pinned Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Verify Helm toolchain
        shell: bash
        run: |
          set -euo pipefail
          helm_version="$(helm version --short)"
          [[ "$helm_version" == v4.3.1* ]] || {
            echo "Unexpected Helm version: ${helm_version%%+*}" >&2
            exit 1
          }

      - name: Verify image provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          gh attestation verify "oci://$image" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$IMAGE_TAG" \
            --deny-self-hosted-runners

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          kubeconfig="$RUNNER_TEMP/zomega-kubeconfig"
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$kubeconfig"
          chmod 600 "$kubeconfig"
          printf 'KUBECONFIG=%s\n' "$kubeconfig" >> "$GITHUB_ENV"
          kubectl cluster-info

      - name: Verify kubectl and API server version skew
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess

          def get_version(command, key):
              payload = json.loads(subprocess.check_output(command, text=True))
              value = payload[key]["gitVersion"]
              match = re.match(r"^v?(\d+)\.(\d+)\.", value)
              if not match:
                  raise SystemExit(f"Cannot parse Kubernetes version: {value!r}")
              return int(match.group(1)), int(match.group(2)), value

          client_major, client_minor, client = get_version(
              ["kubectl", "version", "--client", "-o", "json"], "clientVersion"
          )
          server_major, server_minor, server = get_version(
              ["kubectl", "version", "-o", "json"], "serverVersion"
          )
          if client_major != server_major or abs(client_minor - server_minor) > 1:
              raise SystemExit(
                  f"Unsupported kubectl/API server skew: client={client}, server={server}"
              )
          print(f"kubernetes_version_skew=PASS client={client} server={server}")
          PY

      - name: Sync production runtime secret without putting secret values in argv
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ZOMEGA_API_KEY_PEPPER: ${{ secrets.ZOMEGA_API_KEY_PEPPER }}
          ZOMEGA_ADMIN_TOKEN: ${{ secrets.ZOMEGA_ADMIN_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_CREDITS_1000: ${{ secrets.STRIPE_PRICE_CREDITS_1000 }}
          STRIPE_PRICE_CREDITS_5000: ${{ secrets.STRIPE_PRICE_CREDITS_5000 }}
          STRIPE_PRICE_CREDITS_20000: ${{ secrets.STRIPE_PRICE_CREDITS_20000 }}
          ZOMEGA_PUBLIC_URL: ${{ vars.ZOMEGA_PUBLIC_URL || vars.ZOMEGA_HEALTH_URL || vars.OMEGA_HEALTH_URL }}
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL REDIS_URL ZOMEGA_API_KEY_PEPPER ZOMEGA_ADMIN_TOKEN
            OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
            STRIPE_PRICE_CREDITS_1000 STRIPE_PRICE_CREDITS_5000 STRIPE_PRICE_CREDITS_20000
            ZOMEGA_PUBLIC_URL
          )
          for name in "${required[@]}"; do
            value="${!name:-}"
            test -n "$value" || { echo "Missing production runtime setting: $name" >&2; exit 1; }
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "Invalid newline in production runtime setting: $name" >&2
              exit 1
            }
          done

          umask 077
          secret_file="$(mktemp "$RUNNER_TEMP/zomega-runtime.XXXXXX")"
          chmod 600 "$secret_file"
          trap 'rm -f -- "$secret_file"' EXIT
          {
            printf 'ZOMEGA_ENV=%s\n' 'production'
            printf 'ZOMEGA_PUBLIC_URL=%s\n' "$ZOMEGA_PUBLIC_URL"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'ZOMEGA_API_KEY_PEPPER=%s\n' "$ZOMEGA_API_KEY_PEPPER"
            printf 'ZOMEGA_ADMIN_TOKEN=%s\n' "$ZOMEGA_ADMIN_TOKEN"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
            printf 'STRIPE_PRICE_CREDITS_1000=%s\n' "$STRIPE_PRICE_CREDITS_1000"
            printf 'STRIPE_PRICE_CREDITS_5000=%s\n' "$STRIPE_PRICE_CREDITS_5000"
            printf 'STRIPE_PRICE_CREDITS_20000=%s\n' "$STRIPE_PRICE_CREDITS_20000"
          } > "$secret_file"

          kubectl create namespace zomega --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n zomega create secret generic zomega-runtime \
            --from-env-file="$secret_file" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy atomically
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          helm upgrade --install zomega deploy/helm/zomega \
            --namespace zomega \
            --create-namespace \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --atomic \
            --wait \
            --timeout 10m
          kubectl -n zomega rollout status deployment/zomega-api --timeout=5m
          kubectl -n zomega rollout status deployment/zomega-worker --timeout=5m

      - name: External readiness verification
        env:
          ZOMEGA_HEALTH_URL: ${{ vars.ZOMEGA_HEALTH_URL || vars.OMEGA_HEALTH_URL || vars.zomega_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZOMEGA_HEALTH_URL"
          curl --fail --show-error --silent --retry 8 --retry-all-errors \
            --connect-timeout 5 --max-time 20 \
            "${ZOMEGA_HEALTH_URL%/}/health/ready"

      - name: Clean up deployment credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${KUBECONFIG:-}" ]]; then
            rm -f -- "$KUBECONFIG"
          fi
          rm -f -- "$RUNNER_TEMP/zomega-kubeconfig"
