name: Workflow Trust Boundary Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Candidate-controlled regression check (not an admission control)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run workflow trust-boundary regression checks
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::This PR-triggered job executes candidate-controlled code. Treat it as a regression check only, not as a trusted admission control."
          python3 scripts/check_workflow_security.py

      - name: Run workflow security regression tests
        run: python3 -m unittest discover -s tests -p 'test_workflow_security.py' -v
