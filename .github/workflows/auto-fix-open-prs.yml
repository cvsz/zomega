name: Repository Readiness Scan (read-only)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to scan (optional)
        required: false
        type: string

concurrency:
  group: repository-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Read-only repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Validate optional PR number
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]

      - name: Checkout target revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}

      - name: Reject tracked secret-bearing files
        shell: bash
        run: |
          set -euo pipefail
          secret_files="$(git ls-files | grep -E '(^|/)(\.env$|id_rsa$|id_ed25519$|.*\.pem$|.*\.key$|credentials\.json$|service-account\.json$)' | grep -v '^\.env\.example$' || true)"
          if [ -n "$secret_files" ]; then
            printf '%s\n' "$secret_files"
            exit 1
          fi

      - name: Verify repository ignore baseline
        run: test -f .gitignore

      - name: Record read-only result
        run: |
          {
            echo "## Repository readiness scan"
            echo "- Revision: $(git rev-parse HEAD)"
            echo "- Credentials: none"
            echo "- GitHub write permissions: none"
          } >> "$GITHUB_STEP_SUMMARY"
