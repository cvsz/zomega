name: PR Hygiene Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to inspect (optional)'
        required: false
        type: string

concurrency:
  group: pr-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Read-only PR hygiene checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.pr_number && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || github.ref }}

      - name: Inspect tracked secret-like filenames and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          FINDING_COUNT=0

          SECRET_FILES="$(git ls-files | grep -E '(^|/)(\.env$|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$' || true)"
          if [ -n "$SECRET_FILES" ]; then
            echo "::error::Potential secret-bearing paths are tracked:"
            printf '%s\n' "$SECRET_FILES"
            FINDING_COUNT=$((FINDING_COUNT + 1))
          fi

          if [ ! -f .gitignore ]; then
            echo "::error::Missing .gitignore"
            FINDING_COUNT=$((FINDING_COUNT + 1))
          fi

          {
            echo "## Read-only PR hygiene result"
            echo "- Revision: $(git rev-parse HEAD)"
            echo "- Findings: $FINDING_COUNT"
            echo "- Permissions: contents:read"
            echo "- Secrets: none"
            echo "- Persisted checkout credentials: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FINDING_COUNT" -ne 0 ]; then
            exit 1
          fi
