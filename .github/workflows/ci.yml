name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md ABOUT.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md
            CHANGELOG.md ROADMAP.md IMPLEMENTATION-CHECKLIST.md
            .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/config.yml .github/dependabot.yml
            .editorconfig .gitattributes .env.example Dockerfile Makefile
            migrations/versions/0001_initial.py
            migrations/versions/0002_transactional_reliability.py
            migrations/versions/0003_rotate_legacy_api_key_digests.py
            migrations/versions/0004_argon2_api_keys.py
            migrations/versions/0005_audit_events.py
            migrations/versions/0006_commercial_registry_marketplace.py
            migrations/versions/0007_service_account_roles.py
            migrations/versions/0008_expand_primary_scopes.py
            restore-verify.sh
            .github/workflows/dr-verify.yml
            deploy/helm/zomega/templates/pdb.yaml
            deploy/kubernetes/pdb.yaml
            docs/COMMERCIAL.md docs/PRIVATE_REGISTRY.md docs/DISASTER_RECOVERY.md
            requirements-dev.txt
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done
      - name: Reject tracked secret-bearing files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|id_rsa$|id_ed25519$|.*\.pem$|.*\.key$|credentials\.json$|service-account\.json$)' | grep -v '^\.env\.example$'; then
            echo "Potential secret-bearing file is tracked."
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q zomega tests migrations
      - name: Ruff correctness lint
        run: ruff check zomega tests
      - name: Mypy security and commercial control-plane
        run: mypy zomega/security.py zomega/audit.py zomega/key_service.py zomega/commercial.py zomega/registry.py zomega/marketplace.py
      - name: Validate operational shell scripts
        run: bash -n backup.sh restore-verify.sh verify.sh install.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate catalog contract
        run: |
          python - <<'PY'
          from zomega.catalog import load_skills, load_agents, public_catalog
          assert len(load_skills()) == 100
          assert len(load_agents()) == 12
          assert all("prompt" not in s for s in public_catalog()["skills"])
          print("catalog=PASS skills=100 agents=12")
          PY

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zomega
          POSTGRES_USER: zomega
          POSTGRES_PASSWORD: zomega
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zomega -d zomega"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      zomega_INTEGRATION: "1"
      zomega_ENV: ci
      zomega_PUBLIC_URL: https://example.invalid
      DATABASE_URL: postgresql+psycopg://zomega:zomega@localhost:5432/zomega
      REDIS_URL: redis://localhost:6379/0
      zomega_API_KEY_PEPPER: ci-pepper-ci-pepper-ci-pepper-ci-pepper
      zomega_ADMIN_TOKEN: ci-admin-ci-admin-ci-admin-ci-admin
      OPENAI_API_KEY: ci-openai-not-used
      STRIPE_SECRET_KEY: sk_test_ci_not_used
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_used
      STRIPE_PRICE_CREDITS_1000: price_ci_1000
      STRIPE_PRICE_CREDITS_5000: price_ci_5000
      STRIPE_PRICE_CREDITS_20000: price_ci_20000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Upgrade database from empty
        run: alembic upgrade head
      - name: Billing, queue, control-plane, and commercial integration tests
        run: python -m unittest tests.test_integration_billing tests.test_integration_control_plane tests.test_integration_commercial -v
      - name: API smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m zomega serve > /tmp/zomega-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/live | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8000/v1/catalog | grep '"skills"'
      - name: Verify 2.2 to 3.0 primary-key scope migration
        shell: bash
        run: |
          set -euo pipefail
          alembic downgrade 0005
          python - <<'PY'
          import json, uuid
          from sqlalchemy import create_engine, text
          from zomega.config import settings

          tenant_id = str(uuid.uuid4())
          engine = create_engine(settings.database_url)
          with engine.begin() as conn:
              conn.execute(text(
                  "INSERT INTO tenants (id,name,plan,status) VALUES (:id,'legacy','pro','active')"
              ), {"id": tenant_id})
              conn.execute(text(
                  "INSERT INTO wallets (tenant_id,available_credits,reserved_credits,version) "
                  "VALUES (:id,0,0,0)"
              ), {"id": tenant_id})
              conn.execute(text(
                  "INSERT INTO api_keys "
                  "(id,tenant_id,name,key_prefix,key_digest,scopes,active) "
                  "VALUES (:kid,:tid,'primary',:prefix,:digest,CAST(:scopes AS json),true)"
              ), {
                  "kid": str(uuid.uuid4()),
                  "tid": tenant_id,
                  "prefix": uuid.uuid4().hex[:24],
                  "digest": "$argon2id$v=19$m=65536,t=3,p=4$AAAAAAAAAAAAAAAAAAAAAA$BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB",
                  "scopes": json.dumps(["runs:read"]),
              })
          PY
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from zomega.config import settings
          engine = create_engine(settings.database_url)
          with engine.connect() as conn:
              scopes = conn.execute(text(
                  "SELECT scopes FROM api_keys WHERE name='primary' ORDER BY created_at DESC LIMIT 1"
              )).scalar_one()
          required = {"dashboard:read","subscription:read","registry:read","registry:write","marketplace:read","marketplace:write"}
          assert required.issubset(set(scopes)), scopes
          print("upgrade_scope_migration=PASS")
          PY
      - name: Migration round-trip
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Verify schema head
        run: test "$(alembic current | awk '{print $1}')" = "0008"
